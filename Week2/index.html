<!DOCTYPE html>
<html>
<head>
    <title>Sum Calculator</title>
</head>
<body>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <button onclick="calculateSum()">Calculate Sum</button>
    <button onclick="calculateDifference()">Calculate Difference</button>
    <button onclick="calculateProduct()">Calculate Product</button>

    <p id="demo"></p>

    <script>
        function calculateSum() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let sum = num1 + num2;

            document.getElementById("demo").innerHTML = "Sum = " + sum;
        }
        function calculateDifference() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let difference = num1 - num2;

            document.getElementById("demo").innerHTML = "Difference = " + difference;
        }
        function calculateProduct() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let product = num1 * num2;

            document.getElementById("demo").innerHTML = "Product = " + product;
        }

    </script>

</body>
</html>
