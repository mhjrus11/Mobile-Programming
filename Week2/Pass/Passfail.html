<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass/Fail Checker</title>
</head>
<body>
    <h1>Pass/Fail Checker</h1>
    <p>Enter marks for each subject:</p>

    <form id="marksForm">
        <label>English:</label>
        <input type="number" id="sub1" min="0" max="100" required><br><br>

        <label>Maths:</label>
        <input type="number" id="sub2" min="0" max="100" required><br><br>

        <label>Science:</label>
        <input type="number" id="sub3" min="0" max="100" required><br><br>

        <label>Social Studies:</label>
        <input type="number" id="sub4" min="0" max="100" required><br><br>

        <label>OBT:</label>
        <input type="number" id="sub5" min="0" max="100" required><br><br>

        <label>Technology:</label>
        <input type="number" id="sub6" min="0" max="100" required><br><br>

        <label>Art:</label>
        <input type="number" id="sub7" min="0" max="100" required><br><br>

        <label>IT:</label>
        <input type="number" id="sub8" min="0" max="100" required><br><br>

        <button type="submit">Calculate Result</button>
    </form>

    <h2 id="demo"></h2>

    <script src="script.js"></script>
</body>
</html>
